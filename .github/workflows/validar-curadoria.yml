name: Validar e publicar curadoria da Carcaça
on:
  push:
    paths:
      - 'curadoria/**'
      - 'cenarios/**'
      - 'exemplos/**'
      - 'data/dependencias_materiais_costa_sul.json'
      - 'data/taxonomia_carcaca.json'
      - 'data/regioes_carcaca.json'
      - 'data/faccoes_carcaca.json'
      - 'data/lugares_carcaca.json'
      - 'data/fontes_projeto.json'
      - 'data/rotulos_assentamentos_carcaca.json'
      - 'data/povos_carcaca.json'
      - 'data/fluxos_costa_sul.json'
      - 'schemas/**'
      - 'scripts/validar_curadoria.py'
      - 'scripts/gerar_indices_curadoria.py'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/validar-curadoria.yml'
  pull_request:
    paths:
      - 'curadoria/**'
      - 'cenarios/**'
      - 'exemplos/**'
      - 'data/dependencias_materiais_costa_sul.json'
      - 'data/taxonomia_carcaca.json'
      - 'data/regioes_carcaca.json'
      - 'data/faccoes_carcaca.json'
      - 'data/lugares_carcaca.json'
      - 'data/fontes_projeto.json'
      - 'data/rotulos_assentamentos_carcaca.json'
      - 'data/povos_carcaca.json'
      - 'data/fluxos_costa_sul.json'
      - 'schemas/**'
      - 'scripts/validar_curadoria.py'
      - 'scripts/gerar_indices_curadoria.py'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carcaca-curadoria-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar validador JSON Schema
        run: pip install 'jsonschema>=4,<5'
      - name: Validar curadoria e integridade
        run: python scripts/validar_curadoria.py
      - name: Testar cliente de leitura
        run: node --test tests/carcaca-client.test.mjs
      - name: Gerar índices determinísticos
        run: |
          python scripts/gerar_indices_curadoria.py
          python scripts/gerar_indices_curadoria.py --check
      - name: Publicar snapshot sem sobrepor as fontes SRD
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git add dist/carcaca
          if git diff --cached --quiet; then
            echo "Snapshot autoral já atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(carcaca): atualizar snapshot da curadoria [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
