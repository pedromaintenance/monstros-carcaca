  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carcaca-curadoria-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar validador JSON Schema
        run: pip install 'jsonschema>=4,<5'
      - name: Validar curadoria e integridade
        run: python scripts/validar_curadoria.py
      - name: Testar cliente de leitura
        run: node --test tests/carcaca-client.test.mjs
      - name: Testar atlas hierárquico com fontes reais
        run: node --test tests/atlas-hierarquia.test.mjs tests/atlas-macro.test.mjs tests/atlas-interfaces.test.mjs tests/atlas-topology.test.mjs tests/atlas-charter.test.mjs tests/atlas-hydrology.test.mjs tests/atlas-chronocartography.test.mjs
      - name: Gerar índices determinísticos
        run: |
          python scripts/gerar_indices_curadoria.py
          python scripts/gerar_indices_curadoria.py --check
      - name: Testar dossiês derivados contra curadoria real
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Publicar snapshot sem sobrepor as fontes SRD
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git add dist/carcaca
          if git diff --cached --quiet; then
            echo "Snapshot autoral já atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(carcaca): atualizar snapshot da curadoria [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
