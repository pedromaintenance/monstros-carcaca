name: Sincronizar bestiario aberto
on:
  push:
    branches: [main]
    paths:
      - "scripts/sincronizar.py"
      - ".github/workflows/sincronizar.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: write

concurrency:
  group: carcaca-monsters-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install requests
      - name: Sincronizar fontes abertas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sincronizar.py
      - name: Validar JSON e manifestos
        run: python scripts/validar.py
      - name: Publicar snapshot versionado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar snapshot CC-BY de criaturas [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
